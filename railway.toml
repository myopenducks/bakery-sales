# Repo-root config for Railway (monorepo: API is in backend).
# Docs: https://docs.railway.com/deployments/monorepo

[build]
builder = "RAILPACK"
buildCommand = "npm ci --prefix backend && npm run build --prefix backend"
watchPatterns = ["backend/**"]

[deploy]
startCommand = "npm run start --prefix backend"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
